<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>간단 신청서</title>
</head>
<body>
  <h2>📋 간단 신청서</h2>
  <form onsubmit="submitForm(event)">
    <label>이름:</label><br />
    <input type="text" id="name" required><br /><br />

    <label>연락처:</label><br />
    <input type="tel" id="phone" required><br /><br />

    <button type="submit">신청하기</button>
  </form>

  <script>
    function submitForm(event) {
      event.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value
      };

      fetch("https://script.google.com/macros/s/AKfycbyM397lNy5Qg49iMrhGPbGBzwT06nKO1ARpvbqM_nJKTT6v_SCsQr_w0-6-hoBPGzhf/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.json())
      .then(response => {
        if (response.result === "success") {
          alert("신청이 완료되었습니다!");
        } else {
          alert("⚠️ 오류 발생: 다시 시도해주세요.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("⚠️ 전송 실패. 관리자에게 문의하세요.");
      });
    }
  </script>
</body>
</html>
